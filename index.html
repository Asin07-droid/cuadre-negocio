<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cuadre de Negocio V1.5</title>
    
    <!-- PWA - Icono de la app -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo-app.png">
    <meta name="theme-color" content="#1a237e">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="components.css">
    
    <!-- App -->
    <script type="module" src="app.js"></script>

    <!-- Registro del Service Worker (necesario para que la PWA funcione offline) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('✅ Service Worker registrado con scope:', reg.scope))
            .catch(err => console.error('❌ Error registrando Service Worker:', err));
        });
      }
    </script>
</head>
<body>
    <div id="app">
        <div id="app-content"></div>
        
        <!-- Navegación inferior -->
        <nav class="nav-bottom" id="mainNav">
            <button class="nav-item active" data-page="cuadre">
                <span class="icon">📊</span>
                <span>Cuadre</span>
            </button>
            <button class="nav-item" data-page="historial">
                <span class="icon">📋</span>
                <span>Historial</span>
            </button>
            <button class="nav-item" data-page="inventario">
                <span class="icon">📦</span>
                <span>Inventario</span>
            </button>
        </nav>
    </div>
</body>
</html>
